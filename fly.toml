app = 'togethercast'
primary_region = 'lhr'

[build]

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  BROADCAST_CONNECTION = "reverb"
  QUEUE_CONNECTION = "database"
  CACHE_STORE = "database"
  SESSION_DRIVER = "database"
  REVERB_HOST = "0.0.0.0"
  REVERB_PORT = "8081"
  REVERB_SCHEME = "http"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
